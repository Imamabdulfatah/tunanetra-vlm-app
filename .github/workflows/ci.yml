name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.0"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --no-pub --no-pull

      - name: Build Android APK (debug)
        run: flutter build apk --debug

  arduino-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "export PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Install Arduino core (Arduino AVR Boards)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Verify Arduino sketch
        run: |
          arduino-cli compile --fqbn arduino:avr:uno arduino/src/your_sketch.ino
